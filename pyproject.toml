[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Multi-tenant RAG service: layout-aware chunking, hybrid BM25 + vector retrieval, reranking, and config-driven source onboarding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karan Jain" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
azure = ["langchain-openai>=0.3"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "moto[s3]>=5", "boto3>=1.34"]

[project.scripts]
ragp = "ragplatform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/generate_corpus.py" = ["E501"]  # corpus templates read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
